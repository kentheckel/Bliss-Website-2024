<?xml version="1.0" encoding="UTF-8"?>
<!--
  Deck Icon - a chunky Win95-style presentation slide on a projector stand.
  White slide with a blue title bar, text lines and a growing bar chart,
  sized to match the other 80x80 desktop icons (Icon_Pitch, Icon_Paint).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" shape-rendering="crispEdges">
  <!-- Slide frame: black border with Win95 bevel -->
  <rect x="4" y="8" width="72" height="52" fill="#000"/>
  <rect x="6" y="10" width="68" height="2" fill="#ffffff"/>
  <rect x="6" y="10" width="2" height="48" fill="#ffffff"/>
  <rect x="6" y="56" width="68" height="2" fill="#808080"/>
  <rect x="72" y="10" width="2" height="48" fill="#808080"/>

  <!-- Slide face -->
  <rect x="8" y="12" width="64" height="44" fill="#ffffff"/>

  <!-- Blue title bar with a yellow headline block -->
  <rect x="8" y="12" width="64" height="10" fill="#1649d5"/>
  <rect x="12" y="15" width="26" height="4" fill="#ffd34d"/>

  <!-- Body copy lines -->
  <rect x="12" y="27" width="22" height="3" fill="#000"/>
  <rect x="12" y="33" width="18" height="3" fill="#808080"/>
  <rect x="12" y="39" width="20" height="3" fill="#808080"/>
  <rect x="12" y="45" width="14" height="3" fill="#808080"/>

  <!-- Growing bar chart -->
  <rect x="42" y="42" width="6" height="10" fill="#22b14c"/>
  <rect x="50" y="36" width="6" height="16" fill="#ff6b00"/>
  <rect x="58" y="28" width="6" height="24" fill="#ed1c24"/>
  <rect x="42" y="52" width="24" height="1" fill="#000"/>

  <!-- Stand: neck and foot -->
  <rect x="36" y="60" width="8" height="8" fill="#000"/>
  <rect x="38" y="60" width="4" height="8" fill="#c0c0c0"/>
  <rect x="24" y="68" width="32" height="6" fill="#000"/>
  <rect x="26" y="68" width="28" height="2" fill="#ffffff"/>
  <rect x="26" y="70" width="28" height="2" fill="#c0c0c0"/>
</svg>
